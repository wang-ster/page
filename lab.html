<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Command — Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/settings.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<canvas id="splash" width="320" height="180"></canvas>
<div class="vignette"></div>

<div class="player-shell">
  <header class="player-bar frame">
    <a class="btn ghost sm" href="labs.html">◀ LABS</a>
    <div class="pinfo"><span class="lab-code" id="code"></span><h1 id="title">LOADING…</h1></div>
    <div class="lab-feedback" id="fb"></div>
    <span class="status" id="status"></span>
    <button class="btn green" id="submit" disabled>SUBMIT LAB</button>
  </header>
  <iframe class="lab-frame" id="frame" title="Lab"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
</div>

<script>
/* Uploaded labs run inside a sandboxed frame with no access to your login.
   A tiny bridge gives each lab:
     • localStorage that is saved to the student's account (progress follows them)
     • window.SOC_LAB.progress({score, max})  — optional live score
     • window.SOC_LAB.complete({score, max, answers}) — optional auto-submit      */
(async () => {
  const me = await Core.init('LABS');
  const { sb, esc, must, toast } = Core;
  const id = new URLSearchParams(location.search).get('id');
  const $ = s => document.getElementById(s);

  const { data: lab } = await sb.from('labs').select('*').eq('id', id).maybeSingle();
  if (!lab){ $('title').textContent = 'LAB NOT FOUND'; return; }
  document.title = `${lab.code} · ${lab.title}`;
  $('code').textContent = lab.code + (lab.published ? '' : ' · DRAFT');
  $('title').textContent = lab.title;

  const saved = (await sb.from('lab_state').select('state').eq('user_id', me.id).eq('lab_id', id).maybeSingle()).data;
  let labState = (saved && saved.state) || {};
  let comp = (await sb.from('completions').select('*').eq('user_id', me.id).eq('lab_id', id).maybeSingle()).data;
  let progress = { score: null, max: null };

  function paintStatus(){
    const graded = comp && comp.graded_at;
    $('status').textContent = graded ? '✔ GRADED' : comp ? '✔ SUBMITTED' : 'IN PROGRESS';
    $('submit').disabled = !!graded || !lab.published;
    $('submit').textContent = comp && !graded ? 'RESUBMIT' : 'SUBMIT LAB';
    $('fb').innerHTML = graded ? `GRADE: <b>${esc(comp.grade ?? '—')}</b>${comp.feedback ? ' · ' + esc(comp.feedback) : ''}` : '';
  }
  paintStatus();

  // ---- build the sandboxed lab ----
  const bridge = `<script>(function(){
    var data = ${JSON.stringify(labState).replace(/</g, '\\u003c')};
    var t; function push(){ clearTimeout(t); t = setTimeout(function(){ parent.postMessage({soc:'state', state:data}, '*'); }, 400); }
    function mk(persist){ var d = persist ? data : {}; return {
      getItem:function(k){ return Object.prototype.hasOwnProperty.call(d,k) ? d[k] : null; },
      setItem:function(k,v){ d[k] = String(v); if(persist) push(); },
      removeItem:function(k){ delete d[k]; if(persist) push(); },
      clear:function(){ for (var k in d) delete d[k]; if(persist) push(); },
      key:function(i){ var k = Object.keys(d)[i]; return k === undefined ? null : k; },
      get length(){ return Object.keys(d).length; } }; }
    try { Object.defineProperty(window, 'localStorage',   { value: mk(true),  configurable: true }); } catch(e){}
    try { Object.defineProperty(window, 'sessionStorage', { value: mk(false), configurable: true }); } catch(e){}
    /* in-page "#section" links: keep them inside the lab instead of loading the site into the frame */
    window.addEventListener('click', function(e){
      var a = e.target && e.target.closest && e.target.closest('a[href^="#"]');
      if (!a || e.defaultPrevented) return;
      e.preventDefault();
      var h = a.getAttribute('href');
      if (h.length > 1) location.hash = h; else window.scrollTo(0, 0);
    });
    window.SOC_LAB = {
      progress: function(o){ parent.postMessage({soc:'progress', score:o&&o.score, max:o&&o.max}, '*'); },
      complete: function(o){ parent.postMessage({soc:'complete', score:o&&o.score, max:o&&o.max, answers:o&&o.answers}, '*'); }
    };
  })();<\/script>`;
  let html = lab.html;
  const headAt = html.search(/<head[^>]*>/i);
  if (headAt >= 0){ const end = html.indexOf('>', headAt) + 1; html = html.slice(0, end) + bridge + html.slice(end); }
  else html = bridge + html;
  const frame = $('frame');
  frame.srcdoc = html;

  // ---- messages from the lab ----
  let saveT;
  window.addEventListener('message', async e => {
    if (e.source !== frame.contentWindow || !e.data || !e.data.soc) return;
    const m = e.data;
    if (m.soc === 'state'){
      labState = m.state;
      clearTimeout(saveT);
      saveT = setTimeout(() => sb.from('lab_state').upsert({ user_id: me.id, lab_id: id, state: labState, updated_at: new Date().toISOString() }), 800);
    }
    if (m.soc === 'progress'){ progress = { score: m.score, max: m.max }; }
    if (m.soc === 'complete'){ progress = { score: m.score ?? progress.score, max: m.max ?? progress.max }; await submit(m.answers, true); }
  });

  async function submit(answers, auto){
    if (comp && comp.graded_at) return;
    if (!auto){
      const sc = progress.score != null ? ` Current score: ${progress.score}${progress.max ? ' / ' + progress.max : ''}.` : '';
      const ok = await Core.confirmBox(comp ? 'RESUBMIT LAB?' : 'SUBMIT LAB?',
        `Your work so far will be sent to your CISO for grading. You'll earn ${lab.xp} XP.${sc} You can resubmit until it's graded.`, 'SUBMIT');
      if (!ok) return;
    }
    clearTimeout(saveT);
    await sb.from('lab_state').upsert({ user_id: me.id, lab_id: id, state: labState, updated_at: new Date().toISOString() });
    const { error } = await sb.rpc('submit_lab', {
      p_lab: id, p_score: progress.score, p_max: progress.max,
      p_data: { state: labState, answers: answers ?? null }
    });
    if (error){ toast('SUBMIT FAILED', error.message); return; }
    comp = (await sb.from('completions').select('*').eq('user_id', me.id).eq('lab_id', id).maybeSingle()).data;
    paintStatus(); await Core.refreshMe();
    toast('LAB SUBMITTED', `+${lab.xp} XP`);
  }
  $('submit').onclick = () => submit();
})();
</script>
</body>
</html>
