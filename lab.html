<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Command — Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/settings.js"></script>
<script src="assets/core.js"></script>
<script src="assets/labkit.js"></script>
</head>
<body>
<canvas id="splash" width="320" height="180"></canvas>
<div class="vignette"></div>

<div class="player-shell">
  <header class="player-bar frame">
    <a class="btn ghost sm" href="labs.html">◀ LABS</a>
    <div class="pinfo"><span class="lab-code" id="code"></span><h1 id="title">LOADING…</h1></div>
    <div class="lab-feedback" id="fb"></div>
    <span class="status" id="status"></span>
    <button class="btn green" id="submit" disabled>SUBMIT LAB</button>
  </header>
  <div class="lab-built frame" id="built" hidden><div class="lk-doc" id="doc"></div></div>
  <iframe class="lab-frame" id="frame" title="Lab"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
</div>

<script>
/* Two kinds of lab:
   • Lab Builder labs ("built"): drawn right here; answers and screenshots save to the student's account.
   • Uploaded HTML labs: run in a sandboxed frame with no access to the login. A small bridge
     (LabKit.htmlDoc) saves their localStorage to the account and lets them report a score.   */
(async () => {
  const me = await Core.init('LABS');
  const { sb, esc, toast } = Core;
  const id = new URLSearchParams(location.search).get('id');
  const $ = s => document.getElementById(s);

  let { data: lab } = await sb.from('labs').select('*').eq('id', id).maybeSingle();
  if (!lab){ $('title').textContent = 'LAB NOT FOUND'; return; }
  const built = lab.kind === 'built';
  document.title = `${lab.code} · ${lab.title}`;
  $('code').textContent = lab.code + (lab.published ? '' : ' · DRAFT');
  $('title').textContent = lab.title;

  const saved = (await sb.from('lab_state').select('state').eq('user_id', me.id).eq('lab_id', id).maybeSingle()).data;
  let labState = (saved && saved.state) || {};
  let comp = (await sb.from('completions').select('*').eq('user_id', me.id).eq('lab_id', id).maybeSingle()).data;
  let progress = { score: null, max: null };
  const isLocked = () => !!(comp && !comp.unlocked);       // one submission unless the CISO unlocks it

  function paintStatus(){
    const graded = comp && comp.graded_at;
    $('status').textContent = comp && comp.unlocked ? 'UNLOCKED' : graded ? '✔ GRADED' : comp ? '✔ SUBMITTED' : 'IN PROGRESS';
    $('submit').disabled = isLocked() || !lab.published;
    $('submit').textContent = comp && comp.unlocked ? 'RESUBMIT' : comp ? 'SUBMITTED' : 'SUBMIT LAB';
    $('fb').innerHTML = graded ? `GRADE: <b>${esc(comp.grade ?? '—')}</b>${comp.feedback ? ' · ' + esc(comp.feedback) : ''}` : '';
  }
  paintStatus();

  // ---- saving progress (both kinds) ----
  let saveT;
  const saveNow = () => sb.from('lab_state').upsert({
    user_id: me.id, lab_id: id, state: labState, score: progress.score, max_score: progress.max, updated_at: new Date().toISOString()
  });
  const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(async () => {
    const { error } = await saveNow();
    $('fb').innerHTML = error ? `<span class="err">Not saved: ${esc(error.message)}</span>` : `Saved ${new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })}`;
  }, 800); };

  if (built){
    /* ---------- Lab Builder lab ---------- */
    $('frame').hidden = true; $('built').hidden = false;
    const draw = () => LabKit.render($('doc'), lab, {
      mode: 'student', readOnly: isLocked(), state: labState,
      onChange: st => { labState = st; saveSoon(); },
      upload: async (file, blockId) => {
        const ext = (file.name.split('.').pop() || file.type.split('/')[1] || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
        const path = `${me.id}/${lab.id}/${blockId}-${Date.now()}.${ext || 'png'}`;
        const { error } = await sb.storage.from('screenshots').upload(path, file, { contentType: file.type || 'image/png' });
        if (error) throw new Error(error.message);
        return path;
      },
      remove: path => sb.storage.from('screenshots').remove([path]),
      imgUrl: async path => (await sb.storage.from('screenshots').createSignedUrl(path, 3600)).data.signedUrl
    });
    draw();
    // the CISO can unlock questions mid-lab: check every 15 s and redraw if the lab changed
    let sig = JSON.stringify(lab.content);
    setInterval(async () => {
      const { data } = await sb.from('labs').select('content,published').eq('id', id).maybeSingle();
      if (data && JSON.stringify(data.content) !== sig){
        sig = JSON.stringify(data.content); lab.content = data.content;
        const focused = document.activeElement?.dataset?.answer;
        draw(); toast('LAB UPDATED', 'Your CISO unlocked new content.');
        if (focused) document.querySelector(`[data-answer="${focused}"]`)?.focus();
      }
    }, 15000);
  } else {
    /* ---------- uploaded HTML lab ---------- */
    const frame = $('frame');
    frame.srcdoc = LabKit.htmlDoc(lab.html, labState, { persist: true });
    window.addEventListener('message', async e => {
      if (e.source !== frame.contentWindow || !e.data || !e.data.soc) return;
      const m = e.data;
      if (m.soc === 'state'){ labState = m.state; if (!isLocked()) saveSoon(); }
      if (m.soc === 'progress'){ progress = { score: m.score, max: m.max }; if (!isLocked()) saveSoon(); }
      if (m.soc === 'complete'){ progress = { score: m.score ?? progress.score, max: m.max ?? progress.max }; await submit(m.answers, true); }
    });
  }

  async function submit(answers, auto){
    if (isLocked()) return;
    if (!auto){
      let warn = '';
      if (built){
        const p = LabKit.progress(lab, labState);
        const left = (p.qTotal - p.qDone) + (p.sTotal - p.sDone);
        if (left) warn = ` ${left} question${left === 1 ? '' : 's'}/screenshot${left === 1 ? '' : 's'} still blank.`;
      }
      const sc = progress.score != null ? ` Current score: ${progress.score}${progress.max ? ' / ' + progress.max : ''}.` : '';
      const ok = await Core.confirmBox(comp ? 'RESUBMIT LAB?' : 'SUBMIT LAB?',
        `Your work will be sent to your CISO for grading and you'll earn ${lab.xp} XP.${sc}${warn} You can only submit once, so make sure you're finished.`, 'SUBMIT');
      if (!ok) return;
    }
    clearTimeout(saveT);
    await saveNow();
    const { error } = await sb.rpc('submit_lab', {
      p_lab: id, p_score: progress.score, p_max: progress.max,
      p_data: built ? labState : { state: labState, answers: answers ?? null }
    });
    if (error){ toast('SUBMIT FAILED', error.message); return; }
    comp = (await sb.from('completions').select('*').eq('user_id', me.id).eq('lab_id', id).maybeSingle()).data;
    paintStatus(); await Core.refreshMe();
    if (built) LabKit.render($('doc'), lab, { mode: 'student', readOnly: true, state: labState,
      imgUrl: async path => (await sb.storage.from('screenshots').createSignedUrl(path, 3600)).data.signedUrl });
    toast('LAB SUBMITTED', `+${lab.xp} XP`);
  }
  $('submit').onclick = () => submit();
})();
</script>
</body>
</html>
