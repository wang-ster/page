<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Command — Ranks &amp; Milestones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<canvas id="splash" width="320" height="180"></canvas>
<div class="vignette"></div>

<div class="app">
  <header id="hud" class="hud frame"></header>
  <div id="ticker" class="ticker"></div>

  <main class="stage sub">
    <section class="page frame">
      <div class="page-head">
        <h1>RANKS &amp; MILESTONES<small>// CAREER PROGRESSION</small></h1>
      </div>
      <div class="page-body">
        <p class="note">Clear mini-labs to earn <b>XP</b>. Each new level unlocks a milestone that pays out <b>coins</b>.
          <b>Diamonds</b> are awarded personally by your instructor for great work and extra credit.</p>
        <div class="track" id="track"></div>
      </div>
    </section>
  </main>

  <footer id="nav" class="nav frame"></footer>
</div>

<script src="data/config.js"></script>
<script src="assets/core.js"></script>
<script>
  Core.init('RANKS');
  const { esc, icon } = Core;
  const p = Core.profile();

  document.getElementById('track').innerHTML = SOC.levels.map((l, i) => {
    const done = i <= p.idx, next = i === p.idx + 1;
    const cls = done ? 'done' : next ? 'next' : 'locked';
    const state = done ? (i === 0 ? 'START' : '✔ CLAIMED') : next ? `${l.xp - p.xp} XP TO GO` : 'LOCKED';
    const bar = next
      ? `<div class="bar mini"><i style="width:${(p.pct*100).toFixed(1)}%"></i><span>${p.xp}/${l.xp}</span></div>` : '';
    return `
    <div class="ms frame sm ${cls}">
      <div class="ms-lv">${i + 1}</div>
      <div>
        <h3>${esc(l.name)}</h3>
        <p>${esc(l.rank)} · requires ${l.xp} XP</p>
        ${bar}
      </div>
      <div>
        <div class="reward">${l.coins ? icon('coin') + '+' + l.coins : '—'}</div>
        <div class="state">${state}</div>
      </div>
    </div>`;
  }).join('');
  Core.hydrate();
</script>
</body>
</html>
