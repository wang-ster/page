<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Command — Mini-Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/settings.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<canvas id="splash" width="320" height="180"></canvas>
<div class="vignette"></div>

<div class="app">
  <header id="hud" class="hud frame"></header>
  <div id="ticker" class="ticker"></div>

  <main class="stage sub">
    <section class="page frame">
      <div class="page-head">
        <h1>MINI-LAB ARCHIVE<small>// ALL TRAINING SIMULATIONS</small></h1>
        <div class="actions"><span class="summary" id="summary"></span><a class="btn sm" id="upload" href="console.html#labs" hidden>+ UPLOAD LAB</a></div>
      </div>
      <div class="toolbar">
        <input class="search" id="q" placeholder="> search labs_" autocomplete="off">
        <div class="filters" id="cats"></div>
        <div class="filters" id="stat"></div>
      </div>
      <div class="page-body"><div class="grid" id="grid"><p class="loading">LOADING LABS</p></div></div>
    </section>
  </main>

  <footer id="nav" class="nav frame"></footer>
</div>

<script>
(async () => {
  const me = await Core.init('LABS');
  const { esc, icon, sb, must } = Core;
  if (me.role === 'ciso') document.getElementById('upload').hidden = false;

  const labs = must(await sb.from('labs')
    .select('id,code,title,category,threat,xp,description,published,created_at')
    .order('created_at', { ascending: true }));
  const mine = must(await sb.from('completions')
    .select('lab_id,score,max_score,grade,feedback,graded_at,submitted_at,unlocked').eq('user_id', me.id));
  const done = Object.fromEntries(mine.map(c => [c.lab_id, c]));

  const state = { q: '', cat: 'ALL', status: 'ALL' };
  const cats = ['ALL', ...new Set(labs.map(l => l.category))];

  function chips(id, list, key){
    const el = document.getElementById(id);
    el.innerHTML = list.length > 1 ? list.map(c =>
      `<button class="fchip ${state[key] === c ? 'on' : ''}" data-v="${esc(c)}">${esc(c.toUpperCase())}</button>`).join('') : '';
    el.querySelectorAll('button').forEach(b => b.onclick = () => { state[key] = b.dataset.v; render(); });
  }

  function render(){
    chips('cats', cats, 'cat');
    chips('stat', ['ALL', 'OPEN', 'SUBMITTED'], 'status');
    const q = state.q.toLowerCase();
    const list = labs.filter(l => {
      const sub = !!done[l.id];
      return (state.cat === 'ALL' || l.category === state.cat)
        && (state.status === 'ALL' || (state.status === 'SUBMITTED') === sub)
        && (!q || `${l.code} ${l.title} ${l.description} ${l.category}`.toLowerCase().includes(q));
    });
    document.getElementById('summary').innerHTML = `<b>${mine.filter(c => labs.some(l => l.id === c.lab_id && l.published)).length}</b> / ${labs.filter(l => l.published).length} SUBMITTED`;

    document.getElementById('grid').innerHTML = list.map(l => {
      const c = done[l.id];
      const ic = Core.cfg.categoryIcons[l.category] || 'terminal';
      const threat = Math.max(1, Math.min(3, l.threat || 1));
      const pips = '■'.repeat(threat) + `<i class="off">${'■'.repeat(3 - threat)}</i>`;
      const status = !l.published ? 'DRAFT' : c ? (c.unlocked ? 'UNLOCKED' : c.graded_at ? '✔ GRADED' : '✔ SUBMITTED') : 'OPEN';
      const grade = c && c.graded_at
        ? `<div class="gradeline">GRADE: <b>${esc(c.grade ?? '—')}</b>${c.feedback ? ` · ${esc(c.feedback)}` : ''}</div>` : '';
      return `
      <article class="lab frame sm ${c ? 'cleared' : ''} ${!l.published ? 'locked' : ''}">
        <div class="lab-top"><span class="lab-code">${esc(l.code)}</span><span class="status">${status}</span></div>
        <div class="lab-main">
          <div class="card-icon sm">${icon(ic)}</div>
          <div><h3>${esc(l.title)}</h3><p>${esc(l.description)}</p></div>
        </div>
        <div class="lab-meta">
          <span class="tag">${esc(l.category)}</span>
          <span class="pips">THREAT <i>${pips}</i></span>
          <span class="xp">+${l.xp} XP</span>
        </div>
        ${grade}
        <a class="btn ${c ? 'ghost' : ''}" href="lab.html?id=${encodeURIComponent(l.id)}">${c ? (c.unlocked ? 'RESUBMIT' : 'VIEW') : 'LAUNCH'} ▶</a>
      </article>`;
    }).join('') || `<p class="note">${labs.length ? 'No labs match that search.' : 'No labs have been released yet.'}</p>`;
    Core.hydrate();
  }

  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
  render();
})();
</script>
</body>
</html>
